{% extends "base/base.html" %}

{% block title %}Modifier quantité{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-5">

            <div class="card shadow p-4">
                <h4 class="mb-3">
                    <i class="fas fa-edit"></i> Modifier la quantité
                </h4>

                <p>
                    Article : <strong>{{ article.name }}</strong>
                </p>

                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Quantité</label>
                        <input type="number"
                               name="qty"
                               value="{{ qty }}"
                               min="1"
                               class="form-control"
                               required>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="{% url 'cart' %}" class="btn btn-secondary">
                            Annuler
                        </a>
                        <button class="btn btn-warning">
                            Mettre à jour
                        </button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
{% endblock %}
