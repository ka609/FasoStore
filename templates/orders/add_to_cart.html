{% extends "base/base.html" %}
{% load static %}

{% block title %}Ajouter au panier{% endblock %}

{% block content %}
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6 text-center">

            <div class="card shadow p-4">
                <h3 class="mb-3 text-success">
                    <i class="fas fa-cart-plus"></i> Article ajouté
                </h3>

                <p class="lead">
                    <strong>{{ article.name }}</strong> a été ajouté à votre panier.
                </p>

                <div class="d-flex justify-content-center gap-3 mt-4">
                    <a href="{% url 'cart' %}" class="btn btn-primary">
                        <i class="fas fa-shopping-cart"></i> Voir le panier
                    </a>

                    <a href="{% url 'article_list' %}" class="btn btn-outline-secondary">
                        Continuer mes achats
                    </a>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
