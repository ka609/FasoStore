{% extends 'base/base.html' %}

{% block title %}Annuler Commande | FasoStore{% endblock %}

{% block content %}
<h2>Annuler Commande #{{ order.id }}</h2>

<p>Êtes-vous sûr de vouloir annuler cette commande ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Oui, annuler la commande</button>
    <a href="{% url 'orders_list' %}" class="btn btn-secondary">Non, revenir à mes commandes</a>
</form>
{% endblock %}
