{% extends 'base/base.html' %}

{% block title %}{{ article.name }} | FasoStore{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        {% if images %}
        <div id="carouselImages" class="carousel slide" data-bs-ride="carousel">
            <div class="carousel-inner">
                {% for img in images %}
                <div class="carousel-item {% if forloop.first %}active{% endif %}">
                    <img src="{{ img.image.url }}" class="d-block w-100" alt="{{ article.name }}">
                </div>
                {% endfor %}
            </div>
            <button class="carousel-control-prev" type="button" data-bs-target="#carouselImages" data-bs-slide="prev">
                <span class="carousel-control-prev-icon"></span>
            </button>
            <button class="carousel-control-next" type="button" data-bs-target="#carouselImages" data-bs-slide="next">
                <span class="carousel-control-next-icon"></span>
            </button>
        </div>
        {% endif %}
    </div>

    <div class="col-md-6">
        <h2>{{ article.name }}</h2>
        <p class="fw-bold text-warning">{{ article.price|floatformat:0 }} FCFA</p>
        <p>{{ article.description }}</p>

        <form method="post" action="{% url 'add_to_cart' article.pk %}">
            {% csrf_token %}
            <div class="mb-3">
                <label for="quantity" class="form-label">Quantité</label>
                <input type="number" name="quantity" id="quantity" value="1" min="1" class="form-control w-25">
            </div>
            <button class="btn btn-warning"><i class="fas fa-cart-plus"></i> Ajouter au panier</button>
        </form>
    </div>
</div>
{% endblock %}
