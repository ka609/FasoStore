{% load static %}

<nav class="navbar navbar-expand-lg navbar-dark bg-dark shadow">
    <div class="container">
        <a class="navbar-brand d-flex align-items-center" href="{% url 'article_list' %}">
            <img src="{% static 'images/logo.png' %}" alt="Logo" width="40" class="me-2">
            FasoStore
        </a>

        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto align-items-center">

                <!-- Boutique : PUBLIC -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'article_list' %}">
                        Boutique
                    </a>
                </li>

                <!-- Panier : TOUJOURS VISIBLE -->
                <li class="nav-item">
                    <a class="nav-link" href="{% url 'cart_detail' %}">
                        <i class="fas fa-shopping-cart"></i>
                    </a>
                </li>

                {% if user.is_authenticated %}

                    <!-- Dashboard : CONNECTÉ -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'dashboard' %}">
                            <i class="fas fa-tachometer-alt"></i>
                        </a>
                    </li>

                    <!-- Déconnexion : POST obligatoire -->
                    <li class="nav-item">
                        <form method="post" action="{% url 'logout' %}" class="d-inline">
                            {% csrf_token %}
                            <button type="submit" class="nav-link btn btn-link p-0 text-white">
                                <i class="fas fa-sign-out-alt"></i>
                            </button>
                        </form>
                    </li>

                {% else %}

                    <!-- Connexion : PUBLIC -->
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'login' %}">
                            <i class="fas fa-sign-in-alt"></i>
                        </a>
                    </li>

                {% endif %}
            </ul>
        </div>
    </div>
</nav>
