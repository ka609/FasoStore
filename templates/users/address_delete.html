{% extends 'base/base.html' %}

{% block title %}Supprimer Adresse | FasoStore{% endblock %}

{% block content %}
<h2>Supprimer l’adresse</h2>

<p>Voulez-vous vraiment supprimer l’adresse : <strong>{{ address.address }}, {{ address.city }}, {{ address.country }}</strong> ?</p>

<form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Supprimer</button>
    <a href="{% url 'addresses' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
