{% extends 'base/base.html' %}

{% block title %}Modifier Adresse | FasoStore{% endblock %}

{% block content %}
<h2>Modifier l’adresse</h2>

<form method="post">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn btn-warning">Mettre à jour</button>
    <a href="{% url 'addresses' %}" class="btn btn-secondary">Annuler</a>
</form>
{% endblock %}
